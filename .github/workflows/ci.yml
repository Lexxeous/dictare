name: "auto: test + lint"

on:
  push:
    branches: ["**"]  # Include feature/<request-name> branches.
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system deps
        run: sudo apt-get install -y libportaudio2 xvfb

      - name: Install deps
        run: pip install -e ".[dev]"

      - name: Run linter
        run: ruff check src/ tests/ scripts/release_plan.py scripts/dev_process.py

      - name: Run security scan
        run: bandit -r src/ -lll -q

      - name: Run tests with coverage
        run: xvfb-run pytest tests/ -v -m '' --cov=dictare --cov-report=term-missing --cov-fail-under=45

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install deps
        run: pip install -e ".[dev]"

      - name: Run mypy
        run: mypy src/
